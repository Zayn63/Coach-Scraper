# Save as: .github/workflows/scraper.yml
name: Run Cloud Lead Scraper

on:
  workflow_dispatch:
    inputs:
      category_url:
        description: "Yello category URL"
        default: "https://yello.ae/category/beauty-professionals"
      niche:
        description: "Niche label for the CSV"
        default: "Beauty Professional"
      max_listings:
        description: "New businesses to process this run"
        default: "100"
      max_pages:
        description: "Listing pages to read (about 20 businesses per page)"
        default: "5"
      concurrency:
        description: "Businesses processed at the same time (6-8 is safe)"
        default: "6"

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          CATEGORY_URL: ${{ inputs.category_url }}
          NICHE: ${{ inputs.niche }}
          MAX_LISTINGS: ${{ inputs.max_listings }}
          MAX_PAGES: ${{ inputs.max_pages }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: python scraper.py

      # always() -> even if the run fails halfway, finished rows still get saved
      - name: Commit and push CSVs
        if: always()
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add playwright_uae_beauty.csv playwright_uae_beauty_no_email.csv playwright_uae_beauty_duplicates.csv
          git diff --staged --quiet || (git commit -m "Automated update: scraped beauty leads" && git pull --rebase && git push)

      - name: Keep a copy as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads
          path: playwright_uae_beauty*.csv
