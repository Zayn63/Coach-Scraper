name: Run Cloud Lead Scraper

on:
  workflow_dispatch: # Allows you to press a button to run it manually
  schedule:
    - cron: '0 0 * * 1' # Runs automatically every Monday at midnight

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # FIXED STEP: Force-installs requests and pandas directly into the runner environment
    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Cloud Scraper Script
      env:
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      run: python scraper.py

    - name: Commit and Push CSV Lead Sheet
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add playwright_uae_coaches.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Refreshed UAE Coach Data Sheet" && git push)
 
