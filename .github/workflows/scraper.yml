name: Run Cloud Lead Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=:all: requests pandas

    - name: Run Cloud Database Extractor
      env:
        # Securely links your private Apollo API key into the runtime environment
        APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      run: python scraper.py

    - name: Commit and Push CSV Lead Sheet
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add playwright_uae_coaches.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Refreshed UAE Coach Data Sheet" && git push)
