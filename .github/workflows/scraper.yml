name: Run Playwright Cloud Scraper

on:
  workflow_dispatch: # Allows you to run this manually anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pandas

    # Installs Chromium engine and the Linux packages needed to run it hidden in the cloud
    - name: Install Playwright Chromium & System Dependencies
      run: |
        playwright install chromium
        sudo npx playwright install-deps chromium

    - name: Run Cloud Scraper Script
      run: python scraper.py

    # This will now pass smoothly even if 0 leads are found because the file always exists
    - name: Commit and Push CSV Lead Sheet
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add playwright_uae_coaches.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Refreshed UAE Coach Data Sheet" && git push)
